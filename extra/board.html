<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח תשובות · תרגול כיתה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Mission-control board for the projector: a deep navy room, amber instruments,
   one large live panel that switches from "submissions coming in" to the revealed distribution. */
:root{
  --room:#0c1626; --panel:#13223a; --panel-2:#192c49; --line:#2a4064;
  --ink:#eaf1fb; --dim:#8fa3bf; --amber:#f2a93b; --amber-soft:rgba(242,169,59,.16);
  --go:#3fd0a0; --go-soft:rgba(63,208,160,.18); --alert:#ff7a6b;
  --ui:'Rubik','Segoe UI',Arial,sans-serif; --num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,#1b3157 0%,transparent 60%),var(--room);
  color:var(--ink);font-family:var(--ui);
  padding:18px max(24px,env(safe-area-inset-right)) 28px max(24px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:18px;min-height:100%}

/* top strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-size:.95rem;color:var(--dim);letter-spacing:.02em;margin-inline-end:auto}
.brand b{color:var(--amber);font-weight:700}
select,button,input{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px}
select{padding-inline:14px 30px}
button{cursor:pointer;font-weight:500;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--amber)}
button:active{transform:translateY(1px)}
button.primary{background:var(--amber);color:#1c1304;border-color:var(--amber);font-weight:700}
button.primary:hover{background:#ffbb55}
button[disabled]{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* hero: round title and timer */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.eyebrow{font-size:1rem;color:var(--amber);font-weight:500;letter-spacing:.06em;margin:0 0 4px}
h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.phase{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:1rem}
.phase i{width:10px;height:10px;border-radius:50%;background:var(--dim)}
.phase.live{color:var(--ink);border-color:var(--amber)}
.phase.live i{background:var(--alert);animation:blink 1.2s infinite}
.phase.revealed{color:var(--go);border-color:var(--go)}
.phase.revealed i{background:var(--go)}
@keyframes blink{50%{opacity:.25}}

.timer{position:relative;width:170px;height:170px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .track{fill:none;stroke:var(--panel-2);stroke-width:12}
.timer .arc{fill:none;stroke:var(--amber);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low .arc{stroke:var(--alert)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:2.4rem;
  font-weight:600;direction:ltr}
.timer.done .t{color:var(--alert);animation:blink 1s infinite}
.timer .cap{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:.8rem;color:var(--dim)}

/* main panel */
.panel{flex:1;background:linear-gradient(180deg,var(--panel),#0f1d33);border:1px solid var(--line);border-radius:18px;
  padding:28px clamp(18px,3vw,40px);display:flex;flex-direction:column;gap:22px;min-height:330px}
.counter{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.counter .n{font-family:var(--num);font-size:clamp(4rem,10vw,7.5rem);font-weight:600;line-height:1;color:var(--amber);
  font-variant-numeric:tabular-nums}
.counter .u{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:500}
.counter .hint{color:var(--dim);font-size:1.1rem;margin-inline-start:auto}
.dots{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.dots span{width:26px;height:26px;border-radius:7px;background:var(--amber);box-shadow:0 0 10px var(--amber-soft)}
.dots span.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.idle{font-size:1.4rem;color:var(--dim);line-height:1.6}
.idle b{color:var(--ink)}

.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:minmax(7ch,auto) 1fr;gap:18px;align-items:center;transition:opacity .3s}
.bar .lbl{font-family:var(--num);font-size:clamp(1.4rem,2.8vw,2.1rem);direction:ltr;text-align:left;white-space:nowrap}
.bar .tr{display:flex;align-items:center;gap:14px;min-width:0}
.bar .fill{height:clamp(34px,5vh,50px);border-radius:8px;background:linear-gradient(90deg,#c9861f,var(--amber));
  width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .c{font-family:var(--num);font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:600}
.bar .tag{font-size:1rem;color:var(--go);font-weight:700;white-space:nowrap}
.bars.marked .bar{opacity:.45}
.bars.marked .bar.right{opacity:1}
.bar.right .fill{background:linear-gradient(90deg,#24a77d,var(--go));box-shadow:0 0 24px var(--go-soft)}
.bar.right .lbl{color:var(--go)}
.empty{font-size:1.4rem;color:var(--dim)}

/* footer controls shown after the reveal */
.after{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.after label{display:flex;align-items:center;gap:10px;font-size:1.05rem}
.after input{width:10em;direction:ltr;border-radius:10px}
.after a{color:var(--amber);font-weight:700;text-decoration:none;border:1px solid var(--amber);border-radius:999px;padding:8px 16px}
.after a:hover{background:var(--amber-soft)}
.status{margin-inline-start:auto;font-size:.9rem;color:var(--dim)}
.status.err{color:var(--alert)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .timer{width:130px;height:130px}.timer .t{font-size:1.8rem}.timer .cap{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="strip">
  <div class="brand"><b>מחשבים לפיזיקאים</b> · תרגול כיתה · לוח תשובות</div>
  <select id="round" aria-label="סבב"></select>
  <select id="mins" aria-label="משך הסבב">
    <option value="5">5 דק׳</option><option value="6">6 דק׳</option>
    <option value="7" selected>7 דק׳</option><option value="8">8 דק׳</option><option value="10">10 דק׳</option>
  </select>
  <button id="start" class="primary" type="button">התחלת סבב</button>
  <button id="reveal" type="button" disabled>סיום וחשיפה</button>
</div>

<section class="hero">
  <div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <div class="phase" id="phase"><i></i><span id="phaseText"></span></div>
  </div>
  <div class="timer" id="timer" aria-live="off">
    <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52"/></svg>
    <div class="t" id="clock">7:00</div>
    <div class="cap" id="cap">לעבודה</div>
  </div>
</section>

<main class="panel" id="panel"></main>

<div class="after" id="after" hidden>
  <label>תשובה נכונה <input id="answer" placeholder="לסימון בירוק" autocomplete="off"></label>
  <a id="solution" target="_blank" rel="noopener">לעמוד הפתרון</a>
</div>
<div class="status" id="status">טוען…</div>

<script>
// ------------------------------------------------------------ settings
const SHEET_ID = "16g-krvleCYMoLnQxm9Apx8kxl_gp5DWvYAUmpMpeHfg";
const GID = "1276875717";       // the "Form Responses 1" tab
const REFRESH_MS = 4000;
const TOP = 8;
const ROUNDS = [
  { week: 1, id: "gimli",   n: 0, title: "גימלי",       sub: "דוגמה · יולי 1983",  file: "00_gimli" },
  { week: 1, id: "dhahran", n: 1, title: "דהראן",       sub: "פברואר 1991",        file: "01_dhahran" },
  { week: 1, id: "mars",    n: 2, title: "מאדים",       sub: "ספטמבר 1999",        file: "02_mars" },
  { week: 1, id: "ariane",  n: 3, title: "אריאן 5",     sub: "יוני 1996",          file: "03_ariane" },
  { week: 1, id: "signal",  n: 4, title: "אות רדיו",    sub: "1977",               file: "04_signal" },
  { week: 2, id: "stars",    n: 1, of: 3, title: "אנני ג'אמפ קנון", sub: "שבוע 2 · הרווארד 1901",  file: "13_stars" },
  { week: 2, id: "polar",    n: 2, of: 3, title: "נחתת מאדים",     sub: "שבוע 2 · דצמבר 1999",   file: "11_polar" },
  { week: 2, id: "oumuamua", n: 3, of: 3, title: "אומואמואה",      sub: "שבוע 2 · אוקטובר 2017",  file: "14_oumuamua" },
];

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
const S = { phase: "idle", since: null, endAt: null, rows: [], shownDots: 0, revealedOnce: false };

function store(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
function load(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
// Round start / reveal are logged as rows in the same form, so solve times can be computed later.
// Round = "_start" or "_reveal", Answer = round id, elapsed = round length (start) or seconds since start (reveal).
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSeNgz35HNF6aVscL6w0aJdp50-UhDdP_f76NGQ4j0dRgf7-ow/formResponse";
function logEvent(kind, seconds){
  if (DEMO) return;
  const body = new URLSearchParams({"entry.839828677": "_" + kind, "entry.1193077998": round().id,
    "entry.1055958655": String(seconds)});
  fetch(FORM, { method: "POST", mode: "no-cors", body }).catch(e => console.warn("board: event not logged", e));
}
function sheetId(){ return SHEET_ID || load("cfs_sheet_id") || ""; }
const round = () => ROUNDS.find(r => r.id === $("round").value) || ROUNDS[0];

// Group answers like the notebooks do: numbers to 3 significant figures, text trimmed.
function label(v){
  const s = String(v ?? "").trim();
  const x = Number(s.replace(/,/g, ""));
  if (s === "" || !isFinite(x)) return s;
  if (Math.abs(x) >= 1000) return Math.round(x).toLocaleString("en-US");
  return String(Number(x.toPrecision(3)));
}

// gviz date cells look like "Date(2026,9,20,18,10,5)" (month is 0-based)
function parseDate(v){
  const m = /^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/.exec(v || "");
  return m ? new Date(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0)) : null;
}

// The CSV export keeps every answer as typed. gviz types the Answer column by its majority
// (numbers), so text answers such as "FTFT" come back empty; it is only the fallback.
function parseCsv(text){
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// export timestamps follow the sheet locale, here "26/10/2026 19:57:35" (day first)
function parseCsvDate(v){
  const m = /^(\d+)\/(\d+)\/(\d{4})(?:\s+(\d+):(\d+):(\d+))?/.exec(v || "");
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0)) : null;
}

async function fetchCsv(id){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/export?format=csv&gid=${GID}&_=${Date.now()}`,
                        { cache: "no-store" });
  if (!r.ok) throw new Error("csv http " + r.status);
  const [head, ...body] = parseCsv(await r.text());
  if (!head || head[0].trim().startsWith("<")) throw new Error("csv: not csv (sign-in page?)");
  const cols = head.map(c => c.trim().toLowerCase());
  let ri = cols.indexOf("round"), ai = cols.indexOf("answer");
  if (ri < 0) ri = 1; if (ai < 0) ai = 2;
  return body.map(c => ({ t: parseCsvDate(c[0]),
                          round: String(c[ri] ?? "").trim().toLowerCase(),
                          answer: c[ai] ?? "" }));
}

// Fallback: the gviz endpoint (no publish delay).
// First a plain fetch; if the browser refuses it, fall back to JSONP via a script tag.
function parseResp(resp){
  if (!resp || resp.status === "error") {
    const d = resp && resp.errors && resp.errors[0];
    throw new Error("sheet error: " + (d ? (d.detailed_message || d.message || d.reason) : "unknown"));
  }
  const cols = resp.table.cols.map(c => (c.label || "").trim().toLowerCase());
  let r = cols.indexOf("round"), a = cols.indexOf("answer");
  if (r < 0) r = 1; if (a < 0) a = 2;
  return resp.table.rows.map(row => {
    const c = row.c || [];
    return { t: parseDate(c[0] && c[0].v),
             round: String((c[r] && (c[r].v ?? c[r].f)) ?? "").trim().toLowerCase(),
             answer: (c[a] && (c[a].f ?? c[a].v)) ?? "" };
  });
}

function jsonp(base){
  return new Promise((resolve, reject) => {
    const cb = "__cfs" + Date.now();
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("jsonp timeout")); }, 8000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = resp => { cleanup(); try { resolve(parseResp(resp)); } catch (e) { reject(e); } };
    s.onerror = () => { cleanup(); reject(new Error("jsonp blocked")); };
    s.src = `${base}&tqx=responseHandler:${cb}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

async function fetchRows(){
  if (DEMO) return demoRows();
  const id = sheetId();
  if (!id) throw new Error("no-sheet");
  try { return await fetchCsv(id); } catch (e) { console.warn("board: csv export failed, using gviz", e); }
  const base = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?gid=${GID}`;
  let first;
  try {
    const r = await fetch(`${base}&tqx=out:json&_=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const text = await r.text();
    const i = text.indexOf("{"), j = text.lastIndexOf("}");
    if (i < 0 || j < 0) throw new Error("not json (sign-in page?)");
    return parseResp(JSON.parse(text.slice(i, j + 1)));
  } catch (e) {
    first = e;
  }
  try {
    return await jsonp(base);
  } catch (e) {
    throw new Error(`fetch: ${first.message}; ${e.message}`);
  }
}


function demoRows(){
  const t = S.since || new Date(), r = [];
  const add = (round, answer, n) => { for (let i = 0; i < n; i++) r.push({ t, round, answer }); };
  const k = Math.min(16, Math.floor((Date.now() % 60000) / 3000) + 4);   // grows over time to show the dots
  add("gimli", "10116.892655367232", Math.ceil(k * .55)); add("gimli", "22300", Math.ceil(k * .25));
  add("gimli", "12598.87", Math.ceil(k * .12)); add("gimli", "4916.87", 1);
  add("dhahran", "575.4089355803682", 12); add("dhahran", "57.54089355803682", 5); add("dhahran", "0.343322753926234", 2);
  return r;
}

// ------------------------------------------------------------ rendering
function current(){
  const r = round().id;
  return S.rows.filter(x => x.round === r && (!S.since || !x.t || x.t >= S.since) && String(x.answer).trim() !== "");
}

function renderHeader(){
  const r = round();
  $("eyebrow").textContent = r.n === 0 ? "דוגמה על הלוח" : `סבב ${r.n} מתוך ${r.of || 4}`;
  $("title").textContent = `${r.title} · ${r.sub.replace("דוגמה · ", "")}`;
  const ph = $("phase");
  ph.className = "phase " + S.phase;
  $("phaseText").textContent = { idle: "ממתין להתחלה", live: "הסבב פעיל · התשובות מוסתרות", revealed: "התשובות נחשפו" }[S.phase];
  $("start").textContent = S.phase === "live" ? "התחלה מחדש" : "התחלת סבב";
  $("reveal").disabled = S.phase !== "live";
  $("after").hidden = S.phase !== "revealed";
  $("solution").href = `pages/${r.file}_solution.html`;
}

function renderPanel(){
  const panel = $("panel"), rows = current(), n = rows.length;
  if (S.phase !== "revealed") {
    if (!panel.querySelector(".counter")) {
      panel.innerHTML = `<div class="counter"><span class="n" id="n">0</span><span class="u" id="u">הגשות</span>
        <span class="hint" id="hint"></span></div><div class="dots" id="dots"></div>`;
      S.shownDots = 0;
    }
    $("n").textContent = n;
    $("u").textContent = n === 1 ? "הגשה" : "הגשות";
    $("hint").textContent = S.phase === "idle"
      ? "לחצו על ״התחלת סבב״ כשהעמוד פתוח לסטודנטים"
      : "ההתפלגות תוצג אחרי ״סיום וחשיפה״";
    const dots = $("dots");
    if (n < S.shownDots) { dots.replaceChildren(); S.shownDots = 0; }
    for (let i = S.shownDots; i < n; i++) {
      const d = document.createElement("span");
      if (S.shownDots > 0 || S.phase === "live") d.className = "pop";
      dots.appendChild(d);
    }
    S.shownDots = n;
    return;
  }

  // revealed: the distribution
  const counts = new Map();
  rows.forEach(x => { const k = label(x.answer); counts.set(k, (counts.get(k) || 0) + 1); });
  let items = [...counts.entries()].sort((p, q) => q[1] - p[1]);
  if (items.length > TOP) {
    const rest = items.slice(TOP).reduce((s, x) => s + x[1], 0);
    items = items.slice(0, TOP).concat([["אחר", rest]]);
  }
  const right = $("answer").value.trim() === "" ? null : label($("answer").value);
  const max = Math.max(1, ...items.map(x => x[1]));
  let bars = panel.querySelector(".bars");
  const fresh = !bars;
  if (fresh) { panel.innerHTML = `<div class="counter"><span class="n">${n}</span><span class="u">${n === 1 ? "הגשה" : "הגשות"}</span></div><div class="bars"></div>`; bars = panel.querySelector(".bars"); }
  else panel.querySelector(".counter .n").textContent = n;
  bars.classList.toggle("marked", right !== null && items.some(x => x[0] === right));
  bars.replaceChildren();
  if (!items.length) { bars.innerHTML = `<div class="empty">אין הגשות בסבב הזה.</div>`; return; }
  for (const [k, c] of items) {
    const row = document.createElement("div");
    row.className = "bar" + (right !== null && k === right ? " right" : "");
    row.innerHTML = `<div class="lbl"></div><div class="tr"><div class="fill"></div><span class="c"></span></div>`;
    row.querySelector(".lbl").textContent = k;
    row.querySelector(".c").textContent = c;
    if (right !== null && k === right) {
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "✓ תשובה נכונה";
      row.querySelector(".tr").appendChild(tag);
    }
    bars.appendChild(row);
    const w = (100 * c / max * 0.82) + "%";
    const fill = row.querySelector(".fill");
    if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = w));
    else { fill.style.transition = "none"; fill.style.width = w; }
  }
}

function renderTimer(){
  const total = +$("mins").value * 60;
  let left = total;
  if (S.phase === "live" && S.endAt) left = Math.max(0, Math.round((S.endAt - Date.now()) / 1000));
  if (S.phase === "revealed") left = 0;
  const C = 2 * Math.PI * 52, arc = $("arc");
  arc.style.strokeDasharray = C;
  arc.style.strokeDashoffset = C * (1 - left / total);
  $("clock").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  const t = $("timer");
  t.classList.toggle("low", S.phase === "live" && left <= 60);
  t.classList.toggle("done", S.phase === "live" && left === 0);
  $("cap").textContent = S.phase === "live" && left === 0 ? "הזמן נגמר" : S.phase === "revealed" ? "הסתיים" : "לעבודה";
}

function render(){ renderHeader(); renderPanel(); renderTimer(); }

async function tick(){
  const st = $("status");
  try {
    S.rows = await fetchRows();
    st.className = "status";
    st.textContent = (DEMO ? "נתוני דוגמה · " : "") + "עודכן " + new Date().toLocaleTimeString("he-IL");
  } catch (e) {
    st.className = "status err";
    st.textContent = "לא ניתן לקרוא את הגיליון. ודאו שהוא משותף כ-Anyone with the link: Viewer. (" + e.message + ")";
  }
  renderPanel();
}

// ------------------------------------------------------------ controls
for (const r of ROUNDS) {
  const o = document.createElement("option");
  o.value = r.id; o.textContent = `${r.week}.${r.n} ${r.title}`;
  $("round").appendChild(o);
}
$("round").value = params.get("round") || load("cfs_round") || "gimli";
$("round").addEventListener("change", () => {
  store("cfs_round", $("round").value);
  S.phase = "idle"; S.since = null; S.endAt = null; $("answer").value = ""; $("panel").replaceChildren(); render();
});
$("mins").addEventListener("change", renderTimer);
$("start").addEventListener("click", () => {
  S.phase = "live"; S.since = new Date(); S.endAt = Date.now() + +$("mins").value * 60000;
  logEvent("start", +$("mins").value * 60);
  $("answer").value = ""; $("panel").replaceChildren(); render();
});
$("reveal").addEventListener("click", () => {
  logEvent("reveal", S.since ? Math.round((Date.now() - S.since) / 1000) : "");
  S.phase = "revealed"; $("panel").replaceChildren(); render(); $("answer").focus();
});
$("answer").addEventListener("input", renderPanel);

render();
tick();
setInterval(tick, REFRESH_MS);
setInterval(renderTimer, 1000);
</script>
</body>
</html>
